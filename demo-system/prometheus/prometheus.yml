# Prometheus asks each service for its numbers every 5 seconds ("scraping").
global:
  scrape_interval: 5s
  scrape_protocols: [PrometheusText0.0.4]   # the plain-text format Spring Boot serves

scrape_configs:
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:8080"]

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8080"]
